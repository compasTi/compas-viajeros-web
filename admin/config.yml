backend:
  name: github
  repo: compasTi/compas-viajeros-web
  branch: main
  base_url: https://compas-viajeros-decap-auth.compasviajerosti.workers.dev
  auth_endpoint: /auth
media_folder: media
public_folder: /media
locale: es
collections:
  - name: destinations
    label: Destinos
    description: Agrega, edita, destaca u oculta experiencias de viaje.
    files:
      - file: data/destinations.json
        label: Catálogo de destinos
        name: catalog
        format: json
        fields:
          - label: Destinos
            name: items
            widget: list
            summary: "{{fields.name}} — {{fields.price}}"
            fields:
              - {label: Nombre, name: name, widget: string}
              - {label: Categoría, name: category, widget: select, options: [playa, naturaleza, aventura, cultura, escapada, experiencia]}
              - {label: Etiqueta visible, name: label, widget: string}
              - {label: Fechas, name: dates, widget: string}
              - {label: Precio, name: price, widget: string}
              - {label: Duración, name: duration, widget: string}
              - {label: Descripción, name: description, widget: text}
              - {label: Imagen, name: image, widget: image}
              - {label: Texto alternativo, name: alt, widget: string}
              - {label: Destino destacado, name: featured, widget: boolean, default: false}
              - {label: Disponible, name: active, widget: boolean, default: true}
  - name: testimonials
    label: Testimonios
    description: Agrega, edita, activa u oculta testimonios de viajeros.
    files:
      - file: data/testimonials.json
        label: Testimonios de viajeros
        name: testimonials
        format: json
        fields:
          - label: Testimonios
            name: items
            widget: list
            summary: "{{fields.name}} — {{fields.location}}"
            fields:
              - {label: Nombre de la persona, name: name, widget: string}
              - {label: Comentario, name: comment, widget: text}
              - {label: Ubicación, name: location, widget: string}
              - {label: Foto, name: image, widget: image}
              - {label: Texto alternativo de la foto, name: alt, widget: string}
              - {label: Mostrar testimonio, name: active, widget: boolean, default: true}
